services:
  app:
    container_name: symfony-app
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      target: ${DOCKER_TARGET_APP:-dev}
      args:
        INSTALL_XDEBUG: ${DOCKER_INSTALL_XDEBUG:-false}
    working_dir: /var/www
    environment:
      DOCKER: "1"
      PHP_IDE_CONFIG: "serverName=app.local"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - ./.docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
      - ./.docker/php/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
      - .:/var/www:delegated
    ports:
      - "${EXTERNAL_APP_PORT:-80}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8080/healthz\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    container_name: symfony-db
    image: postgres:17.10-alpine
    ports:
      - "${EXTERNAL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  app:
    driver: bridge
    name: app-network
